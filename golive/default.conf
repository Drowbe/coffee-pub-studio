## Coffee Pub site. Based on the linuxserver default; changes are marked CHANGED.
## The previous file is backed up by 1-prepare.ps1 to A:\coffeepub\plan\backup-before-golive\nginx\default.conf

# CHANGED: see the real visitor address behind the reverse proxy
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    listen 443 quic reuseport default_server;
    listen [::]:443 quic reuseport default_server;

    server_name _;

    include /config/nginx/ssl.conf;

    set $root /app/www/public;
    if (!-d /app/www/public) {
        set $root /config/www;
    }
    root $root;
    index index.html index.htm index.php;

    # CHANGED: anything that is not a real file goes to the PHP router
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # CHANGED: application code and content are never served directly
    location ^~ /app/ { deny all; }

    # CHANGED: an extra password in front of the admin pages
    location ^~ /admin {
        auth_basic "Admin";
        auth_basic_user_file /config/nginx/.htpasswd;
        try_files $uri /index.php?$query_string;
    }

    # CHANGED: long cache for fonts, images and the stylesheet
    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~ ^(.+\.php)(.*)$ {
        fastcgi_split_path_info ^(.+\.php)(.*)$;
        if (!-f $document_root$fastcgi_script_name) { return 404; }
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include /etc/nginx/fastcgi_params;
    }

    # deny access to .htaccess/.htpasswd files
    location ~ /\.ht {
        deny all;
    }
}
